name: proofmint

networks:
  proofmint:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: proofmint-mysql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    ports:
      - "33061:3306"
    networks:
      - proofmint
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-manager:
    image: adminer:latest
    container_name: proofmint-db-manager
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:18081:8080"  # full DB access — host-only, never expose publicly
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - proofmint

  vault:
    image: hashicorp/vault:latest
    container_name: proofmint-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "18200:8200"
    volumes:
      - ./docker/vault/config:/vault/config:ro
      - ./docker/vault/data/file:/vault/file
      - ./docker/vault/data/logs:/vault/logs
    entrypoint: vault server -config=/vault/config/vault.json
    networks:
      - proofmint

  ipfs:
    image: ipfs/kubo:latest
    container_name: proofmint-ipfs
    restart: unless-stopped
    ports:
      - "14001:4001"       # swarm (p2p, safe to expose publicly)
      - "127.0.0.1:15001:5001"  # RPC API — host-only, never expose publicly
      - "18080:8080"       # HTTP gateway
    volumes:
      - ./docker/ipfs/data:/data/ipfs
    networks:
      - proofmint

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: proofmint-app:latest
    container_name: proofmint-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./vault-seal-keys.json:/app/vault-seal-keys.json
    ports:
      - "13000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      vault:
        condition: service_started
      ipfs:
        condition: service_started
    networks:
      - proofmint

  pin-ipfs-cron:
    build:
      context: .
      dockerfile: Dockerfile
    image: proofmint-app:latest
    container_name: proofmint-pin-ipfs-cron
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    entrypoint: ["/bin/sh", "-c"]
    # No system cron daemon in the runner image — a sleep loop is simpler
    # than adding one just for a single hourly job. pin:ipfs is idempotent
    # (skips already-pinned CIDs), so overlapping/late runs are harmless.
    command:
      - |
        while true; do
          echo "[$(date -Iseconds)] running pnpm pin:ipfs";
          pnpm pin:ipfs;
          sleep 3600;
        done
    depends_on:
      mysql:
        condition: service_healthy
      ipfs:
        condition: service_started
    networks:
      - proofmint
